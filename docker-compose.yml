services:
  postgres:
    image: postgres:16
    container_name: flyrank-widget-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: flyrank_dev
      POSTGRES_DB: widgetplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyrank -d widgetplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: